<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edenred | Rocha Services</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link href="../css.css" rel="stylesheet">

    <style>
        .balance-card {
            text-align: center;
            padding: 2rem;
        }

        .balance-card .amount {
            font-size: 3rem;
            font-weight: 600;
            color: #198754;
            margin-top: 1rem;
        }

        .refresh-btn {
            margin-top: 1rem;
        }

        .table-card {
            margin-top: 2rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .edenred-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 1rem;
        }

        .status {
            font-size: 0.9rem;
            color: #999;
        }
    </style>

</head>

<script type="module" src="../login.js"></script>

<body>

    <header>

        <div class="logo">
            <img src="../images/logo.png">
        </div>

        <div class="user" id="userInfo">
            Cargando...
        </div>

    </header>

    <div class="container">

        <div class="welcome">

            <h1>Edenred</h1>

            <p>
                Consulta del saldo compartido de tarjetas Edenred.
            </p>

        </div>

        <div class="cards">

            <div class="card balance-card">

                <div>
                    💳
                </div>

                <h3>Saldo total disponible</h3>

                <div id="totalBalance" class="amount">
                    --
                </div>

                <button class="btn btn-dark refresh-btn" onclick="loadBalance()">
                    Actualizar
                </button>

            </div>

            <div class="card">

                <h3>Tarjetas</h3>

                <p id="cardCount">
                    Cargando...
                </p>

            </div>

        </div>

        <div class="card content table-card">

            <h3 class="mb-4">
                Tarjetas Edenred
            </h3>

            <div id="loading" class="loading">
                Consultando saldo...
            </div>

            <div id="otpBox" style="display:none">

                <div class="alert alert-warning">

                    Edenred requiere validación OTP.

                    <div class="mt-3">

                        <input id="otp" class="form-control" maxlength="6" placeholder="Código OTP">

                        <button class="btn btn-warning mt-2" onclick="validateOtp()">

                            Validar OTP

                        </button>

                    </div>

                </div>

            </div>

            <div id="tableContainer" style="display:none">

                <table class="table table-striped">

                    <thead>

                        <tr>
                            <th>Tarjeta</th>
                            <th>Número</th>
                            <th>Saldo</th>
                        </tr>

                    </thead>

                    <tbody id="cardsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        async function invokeEdenred(body = {}) {

            const session = window.state?.session;

            if (!session) {
                throw new Error("No existe sesión activa");
            }

            const response = await fetch(
                "https://TU_PROYECTO.supabase.co/functions/v1/edenred-balance",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + session.access_token
                    },
                    body: JSON.stringify(body)
                }
            );

            return {
                status: response.status,
                data: await response.json()
            };
        }

        async function loadBalance() {

            document.getElementById("loading").style.display = "block";
            document.getElementById("otpBox").style.display = "none";
            document.getElementById("tableContainer").style.display = "none";

            try {

                const result = await invokeEdenred();

                if (result.data.otpRequired) {

                    document.getElementById("loading").style.display = "none";
                    document.getElementById("otpBox").style.display = "block";

                    return;
                }

                renderCards(result.data);

            } catch (error) {

                document.getElementById("loading").innerHTML =
                    "<div class='alert alert-danger'>" +
                    error.message +
                    "</div>";

            }
        }

        async function validateOtp() {

            const otp = document.getElementById("otp").value.trim();

            if (otp.length !== 6) {
                alert("OTP incorrecto");
                return;
            }

            try {

                const result = await invokeEdenred({
                    otp
                });

                renderCards(result.data);

            } catch (error) {

                alert(error.message);

            }

        }

        function renderCards(data) {

            document.getElementById("loading").style.display = "none";
            document.getElementById("otpBox").style.display = "none";
            document.getElementById("tableContainer").style.display = "block";

            document.getElementById("totalBalance").textContent =
                Number(data.totalBalance).toFixed(2) + " €";

            document.getElementById("cardCount").textContent =
                data.cards.length + " tarjeta(s)";

            const tbody = document.getElementById("cardsTable");

            tbody.innerHTML = "";

            for (const card of data.cards) {

                tbody.insertAdjacentHTML(
                    "beforeend",
                    `
            <tr>
                <td>${card.cardName}</td>
                <td>${card.cardNumber ?? "-"}</td>
                <td><strong>${card.balance} €</strong></td>
            </tr>
            `
                );
            }

        }

        window.addEventListener("load", () => {

            setTimeout(loadBalance, 500);

        });

    </script>

</body>

</html>
