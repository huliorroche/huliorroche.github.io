<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Rocha Services</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --rocha-black: #161b24;
            --rocha-gold: #b99b68;
            --rocha-gold-light: #d2bb91;
            --rocha-bg: #f7f6f3;
            --rocha-card: #ffffff;
            --rocha-border: #e9e3d7;
            --rocha-text: #161b24;
            --rocha-muted: #7f8691;
        }

        * {
            box-sizing: border-box;
        }

        body {

            font-family: "Inter", sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                radial-gradient(circle at top right,
                    rgba(185, 155, 104, .12),
                    transparent 35%),
                radial-gradient(circle at bottom left,
                    rgba(185, 155, 104, .08),
                    transparent 30%),
                linear-gradient(135deg,
                    #faf9f7,
                    #f3f1ec);
        }

        .login-card {

            width: 100%;
            max-width: 540px;

            background: rgba(255, 255, 255, .96);

            border: 1px solid var(--rocha-border);

            border-radius: 32px;

            padding: 50px;

            box-shadow:
                0 30px 80px rgba(22, 27, 36, .08),
                0 10px 30px rgba(22, 27, 36, .04);

            backdrop-filter: blur(20px);
        }

        .logo-container {

            text-align: center;

            margin-bottom: 25px;
        }

        .logo-placeholder {
            max-width: 120px;
            height: auto;
        }

        .brand-title {

            font-family: "Cormorant Garamond", serif;

            text-align: center;

            color: var(--rocha-black);

            font-size: 3rem;

            letter-spacing: .1em;

            margin-bottom: 6px;
        }

        .brand-divider {

            width: 120px;
            height: 2px;

            background: var(--rocha-gold);

            margin: 0 auto 0;
        }

        .subtitle {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 35px;
            font-family: "Cormorant Garamond", serif;
        }

        .input {

            width: 100%;

            background: white;

            border: 1px solid var(--rocha-border);

            border-radius: 16px;

            padding: 15px 18px;

            margin-bottom: 14px;

            color: var(--rocha-text);

            font-size: .95rem;

            transition: .2s;
        }

        .input:focus {

            outline: none;

            border-color: var(--rocha-gold);

            box-shadow:
                0 0 0 5px rgba(185, 155, 104, .15);
        }

        .input::placeholder {
        }

        .email-btn,
        .register-btn,
        .github-btn {

            width: 100%;

            border: 0;

            border-radius: 16px;

            padding: 15px;

            font-weight: 600;

            transition: .25s;

            cursor: pointer;
        }

        .email-btn:hover,
        .register-btn:hover,
        .github-btn:hover {
            transform: translateY(-2px);
        }

        .email-btn {

            background:
                linear-gradient(135deg,
                    var(--rocha-gold),
                    var(--rocha-gold-light));

            color: white;

            margin-bottom: 12px;
        }

        .email-btn:hover {

            box-shadow:
                0 12px 30px rgba(185, 155, 104, .35);
        }

        .register-btn {

            background: #f8f6f2;

            color: var(--rocha-black);

            border: 1px solid var(--rocha-border);

            margin-bottom: 24px;
        }

        .register-btn:hover {

            background: white;
        }

        .divider {

            display: flex;
            align-items: center;

            gap: 15px;


            margin-bottom: 24px;

            font-size: .9rem;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: var(--rocha-border);
        }

        .github-btn {

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            background: var(--rocha-black);

            color: white;
        }

        .github-btn:hover {

            background: #262d38;

            box-shadow:
                0 12px 30px rgba(22, 27, 36, .25);
        }

        .loading {
            opacity: .7;
            pointer-events: none;
        }

        .footer-note {

            text-align: center;

            margin-top: 20px;


            font-size: .85rem;
        }

        @media (max-width:576px) {

            .login-card {
                padding: 35px 25px;
            }

            .brand-title {
                font-size: 2.3rem;
            }
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo-container">
            <img src="images/logo.png" class="logo-placeholder">
        </div>

        <h1 class="brand-title">
            ROCHA
        </h1>

        <div class="brand-divider"></div>

        <div class="subtitle">
            services
        </div>

        <input id="email" class="input" type="email" placeholder="Correo electrónico">

        <input id="password" class="input" type="password" placeholder="Contraseña">

        <button class="email-btn" onclick="loginWithEmail()">
            Iniciar sesión
        </button>

        <!-- <button class="register-btn" onclick="registerWithEmail()">
            Crear cuenta
        </button> -->

        <div class="divider">
            o
        </div>

        <button class="github-btn" onclick="loginWithGithub()">

            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">

                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54
            2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49
            -2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01
            1.08.58 1.23.82.72 1.21 1.87.87
            2.33.66.07-.52.28-.87.5-1.07
            -1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2
            -.36-1.02.08-2.12
            0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0
            c1.53-1.04 2.2-.82 2.2-.82.44 1.1
            .16 1.92.08 2.12.51.56.82 1.27.82 2.15
            0 3.07-1.87 3.75-3.65 3.95
            .29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2
            0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8
            c0-4.42-3.58-8-8-8z" />

            </svg>

            Iniciar sesión con GitHub

        </button>

    </div>

</body>

</html>
