<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROCHA</title>

<style>
:root {
    --primary: #4f7cff;
    --secondary: #7a5cff;
    --bg: #0f172a;
    --card: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.12);
    --text: #ffffff;
    --muted: #b3b9c9;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Segoe UI, sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#4f7cff55,transparent 35%),
        radial-gradient(circle at bottom right,#7a5cff55,transparent 35%),
        var(--bg);
    color:white;
}

header{
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:2rem;
    font-weight:800;
    letter-spacing:8px;
}

.user{
    color:#b3b9c9;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.welcome{
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    padding:25px;
    border-radius:20px;
    background:var(--card);
    backdrop-filter:blur(18px);
    border:1px solid var(--border);
}

.content{
    min-height:350px;
}
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://lpmpqeibsrzvmmvjnmgf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbXBxZWlic3J6dm1tdmpubWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTY1OTksImV4cCI6MjEwODA3MjU5OX0.onXwjCF71iu-yHR3yVYVhnEoARS2YWQWpKVftS99Stg';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const {
    data: { session }
} = await supabase.auth.getSession();

if (!session) {
    window.location.replace("index.html");
}

const user = session.user;

const githubUsername =
    user.user_metadata?.user_name ||
    user.user_metadata?.preferred_username ||
    user.email;

const fullName =
    user.user_metadata?.full_name ||
    githubUsername;

const avatar =
    user.user_metadata?.avatar_url;

document.querySelector(".welcome h1").textContent =
    `Bienvenido ${fullName}`;

document.querySelector(".welcome p").textContent =
    "Has iniciado sesión correctamente con GitHub.";

document.getElementById("userInfo").innerHTML = `
    <div style="
        display:flex;
        align-items:center;
        gap:10px;
    ">
        <img
            src="${avatar}"
            alt=""
            style="
                width:40px;
                height:40px;
                border-radius:50%;
            "
        >

        <div style="text-align:right;">
            <div>${fullName}</div>
            <div style="
                font-size:.85rem;
                color:#b3b9c9;
            ">
                @${githubUsername}
            </div>
        </div>

        <button
            id="logoutButton"
            style="
                margin-left:12px;
                background:none;
                border:1px solid rgba(255,255,255,.2);
                color:white;
                padding:8px 12px;
                border-radius:10px;
                cursor:pointer;
            "
        >
            Salir
        </button>
    </div>
`;

document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

        await supabase.auth.signOut();

        window.location.replace(
            "index.html"
        );
    });

</script>

<body>

<header>

    <div class="logo">R</div>

    <div class="user" id="userInfo">
    Cargando...
</div>

</header>

<div class="container">

    <div class="welcome">
        <h1>Bienvenido</h1>
        <p>Has iniciado sesión correctamente.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Proyectos</h3>
            <p>Acceso a la información principal.</p>
        </div>

        <div class="card">
            <h3>Actividad</h3>
            <p>Últimos movimientos del sistema.</p>
        </div>

    </div>

    <div class="card content">
        Área principal de trabajo
    </div>

</div>

</body>
</html>
