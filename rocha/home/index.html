<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | Rocha Services</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --rocha-black: #161b24;
            --rocha-gold: #b99b68;
            --rocha-gold-light: #d2bb91;
            --rocha-bg: #f7f6f3;
            --rocha-card: #ffffff;
            --rocha-border: #e9e3d7;
            --rocha-text: #161b24;
            --rocha-muted: #7f8691;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: "Inter", sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(circle at top right,
                    rgba(185, 155, 104, .12),
                    transparent 35%),
                radial-gradient(circle at bottom left,
                    rgba(185, 155, 104, .08),
                    transparent 30%),
                linear-gradient(135deg,
                    #faf9f7,
                    #f3f1ec);

            color: var(--rocha-text);
        }

        header {

            height: 90px;

            background: rgba(255, 255, 255, .92);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid var(--rocha-border);

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 40px;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {

            display: flex;
            align-items: center;
        }

        .logo img {

            height: 58px;
            width: auto;
        }

        .user {

            color: var(--rocha-text);
        }

        .container {

            max-width: 1300px;

            margin: auto;

            padding: 50px 20px;
        }

        .welcome {

            margin-bottom: 35px;
        }

        .welcome h1 {

            font-family: "Cormorant Garamond", serif;

            font-size: 3rem;

            color: var(--rocha-black);

            margin-bottom: 10px;
        }

        .welcome p {

            color: var(--rocha-muted);

            font-size: 1rem;
        }

        .cards {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 24px;

            margin-bottom: 24px;
        }

        .card {

            border: none;

            border-radius: 28px;

            background: rgba(255, 255, 255, .92);

            backdrop-filter: blur(15px);

            border: 1px solid var(--rocha-border);

            box-shadow:
                0 15px 40px rgba(22, 27, 36, .05);

            padding: 30px;

            transition: .25s;
        }

        .card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 20px 50px rgba(22, 27, 36, .08);
        }

        .card h3 {

            font-family: "Cormorant Garamond", serif;

            font-size: 1.8rem;

            color: var(--rocha-black);

            margin-bottom: 10px;
        }

        .card p {

            color: var(--rocha-muted);

            margin-bottom: 0;
        }

        .content {

            min-height: 500px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.15rem;

            color: var(--rocha-muted);
        }

        .section-title {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 2rem;

            margin-bottom: 20px;

            color: var(--rocha-black);
        }

        @media (max-width:768px) {

            header {
                padding: 15px 20px;
                height: auto;
                flex-wrap: wrap;
                gap: 15px;
            }

            .logo img {
                height: 46px;
            }

            .welcome h1 {
                font-size: 2.3rem;
            }

            .container {
                padding: 30px 15px;
            }

            .card {
                padding: 24px;
            }
        }
    </style>

</head>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
        'https://lpmpqeibsrzvmmvjnmgf.supabase.co';

    const SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbXBxZWlic3J6dm1tdmpubWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTY1OTksImV4cCI6MjEwODA3MjU5OX0.onXwjCF71iu-yHR3yVYVhnEoARS2YWQWpKVftS99Stg';

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        window.location.replace("index.html");
    }

    const user = session.user;

    const email = user.email || '';

    const username =
        user.user_metadata?.user_name ||
        user.user_metadata?.preferred_username ||
        email.split('@')[0];

    const fullName =
        user.user_metadata?.full_name ||
        username;

    const avatar =
        user.user_metadata?.avatar_url || null;

    const provider =
        user.app_metadata?.provider || 'email';

    document.querySelector(".welcome h1").textContent =
        `Bienvenido ${fullName}`;

    document.querySelector(".welcome p").textContent =
        provider === 'github'
            ? 'Has iniciado sesión correctamente con GitHub.'
            : 'Has iniciado sesión correctamente con correo electrónico.';

    if (avatar) {

        document.getElementById("userInfo").innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            gap:10px;
        ">
            <img
                src="${avatar}"
                alt=""
                style="
                    width:40px;
                    height:40px;
                    border-radius:50%;
                "
            >

            <div style="text-align:right;">
                <div>${fullName}</div>
                <div style="
                    font-size:.85rem;
                    color:#7f8691;
                ">
                    @${username}
                </div>
            </div>

            <button
                id="logoutButton"
                style="
                    margin-left:12px;
                    background:white;
                    border:1px solid #e9e3d7;
                    color:#161b24;
                    padding:8px 12px;
                    border-radius:10px;
                    cursor:pointer;
                "
            >
                Salir
            </button>
        </div>
    `;

    } else {

        document.getElementById("userInfo").innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            gap:10px;
        ">

            <div style="
                width:40px;
                height:40px;
                border-radius:50%;
                background:#b99b68;
                color:white;
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:bold;
            ">
                ${fullName.charAt(0).toUpperCase()}
            </div>

            <div style="text-align:right;">
                <div>${fullName}</div>
                <div style="
                    font-size:.85rem;
                    color:#7f8691;
                ">
                    ${email}
                </div>
            </div>

            <button
                id="logoutButton"
                style="
                    margin-left:12px;
                    background:white;
                    border:1px solid #e9e3d7;
                    color:#161b24;
                    padding:8px 12px;
                    border-radius:10px;
                    cursor:pointer;
                "
            >
                Salir
            </button>
        </div>
    `;
    }

    document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {

            await supabase.auth.signOut();

            window.location.replace(
                "index.html"
            );
        });
</script>

<body>

    <header>

        <div class="logo">
            <img src="../images/logo.png">
        </div>

        <div class="user" id="userInfo">
            Cargando...
        </div>

    </header>

    <div class="container">

        <div class="welcome">

            <h1>Bienvenido</h1>

            <p>
                Has iniciado sesión correctamente.
            </p>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Proyectos</h3>

                <p>
                    Acceso a la información principal.
                </p>

            </div>

            <div class="card">

                <h3>Actividad</h3>

                <p>
                    Últimos movimientos del sistema.
                </p>

            </div>

        </div>

        <div class="card content">

            Área principal de trabajo

        </div>

    </div>

</body>

</html>
