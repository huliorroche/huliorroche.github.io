<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Redirigiendo…</title>

</head>

<body>

    <p id="message">
        Redirigiendo...
    </p>

    <script type="module">

        import { createClient }
        from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL =
            'https://lpmpqeibsrzvmmvjnmgf.supabase.co';

        const SUPABASE_ANON_KEY =
            'TU_ANON_KEY';

        const supabase =
            createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        const person =
            new URLSearchParams(
                window.location.search
            ).get("person");

        if (!person) {

            document.getElementById(
                "message"
            ).textContent =
                "Falta el parámetro person.";

            throw new Error(
                "Missing person parameter"
            );

        }

        try {

            const {
                data,
                error
            } =
                await supabase
                    .from(
                        "legacy_access_token"
                    )
                    .select(
                        "access_token"
                    )
                    .eq(
                        "legacy_token",
                        person
                    )
                    .single();

            if (error) {
                throw error;
            }

            if (!data?.access_token) {

                document.getElementById(
                    "message"
                ).textContent =
                    "No existe ninguna relación para este identificador.";

                throw new Error(
                    "Token not found"
                );

            }

            window.location.replace(
                `/rocha/debts/?access=${encodeURIComponent(
                    data.access_token
                )}`
            );

        } catch (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).textContent =
                "No se pudo realizar la redirección.";

        }

    </script>

</body>

</html>
