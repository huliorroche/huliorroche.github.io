<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailMap</title>
<style>
:root{--bg:#f7f8fb;--ink:#111827;--panel:rgba(255,255,255,.94);--border:#d8dde8;--grid:rgba(15,23,42,.045)}@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--ink:#f8fafc;--panel:rgba(17,24,39,.94);--border:#334155;--grid:rgba(255,255,255,.045)}}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}.app{height:100%;display:grid;grid-template-rows:60px 1fr}.bar{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:2}.brand{font-weight:850;font-size:20px;margin-right:auto}.brand span{color:#4f46e5}.bar input,.bar button{height:38px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--ink);padding:0 12px}.bar input{width:min(300px,35vw)}.bar button{cursor:pointer}.bar .primary{background:var(--ink);color:var(--bg)}.stage{position:relative;overflow:hidden;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);background-size:24px 24px}svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}svg.dragging{cursor:grabbing}.route-halo,.route-line{fill:none;stroke-linecap:round;stroke-linejoin:round}.route-halo{stroke:var(--bg)}.label{fill:var(--ink);font-size:16px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}.stop-ring{fill:var(--bg);stroke-width:6}.station-hit{fill:transparent;cursor:pointer}.station.match .label{fill:#f59e0b}.route.dim,.station.dim{opacity:.12}.route,.station{transition:opacity .18s}.legend{position:absolute;left:16px;bottom:16px;max-height:40%;overflow:auto;width:min(260px,calc(100% - 32px));padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 16px 40px #0f172426}.legend h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin:2px 6px 7px}.legend button{display:flex;width:100%;align-items:center;gap:9px;border:0;border-radius:9px;background:transparent;color:var(--ink);padding:8px;cursor:pointer;text-align:left}.legend button:hover{background:#7f7f7f18}.swatch{width:28px;height:7px;border-radius:9px}.status,.tip{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:0 12px 36px #0f17242e;padding:10px 13px;font-size:13px}.status{top:14px;left:50%;transform:translateX(-50%);text-align:center}.tip{pointer-events:none;max-width:280px}.tip[hidden],.status[hidden]{display:none}.tip small{color:#64748b}@media(max-width:680px){.brand{font-size:17px}.bar input{position:absolute;top:68px;left:12px;width:calc(100% - 24px);z-index:4;background:var(--panel)}.bar{padding:10px}.bar button{padding:0 9px}}
</style></head><body><main class="app"><header class="bar"><div class="brand"><span>Rail</span>Map</div><input id="search" type="search" placeholder="Buscar estación…"><button id="out">−</button><button id="in">+</button><button id="fit" class="primary">Centrar</button></header><section id="stage" class="stage"><svg id="map" aria-label="Mapa ferroviario"><g id="view"></g></svg><div id="status" class="status">Cargando mapa…</div><aside id="legend" class="legend"><h2>Líneas</h2></aside><div id="tip" class="tip" hidden></div></section></main>
<script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#map'),view=$('#view'),stage=$('#stage'),status=$('#status'),tip=$('#tip'),legend=$('#legend');let stations=new Map,lines=[],edgeMap,bounds,cam={x:0,y:0,s:1},drag=null;
const E=(n,a={},t='')=>{const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(t)e.textContent=t;return e},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=(a,b)=>[a,b].sort().join('|'),unit=(a,b)=>{let x=b.x-a.x,y=b.y-a.y,d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}},normal=(a,b)=>{const u=unit(a,b);return{x:-u.y,y:u.x}};
async function load(file){const r=await fetch(file,{cache:'no-store'});if(!r.ok)throw Error(`${file}: HTTP ${r.status}`);const x=new DOMParser().parseFromString(await r.text(),'application/xml');if(x.querySelector('parsererror'))throw Error(`${file}: XML no válido`);return x}
function readStations(x){return new Map([...x.querySelectorAll('station')].map(n=>[n.getAttribute('id'),{id:n.getAttribute('id'),name:n.getAttribute('name')||n.getAttribute('id'),x:+n.getAttribute('x'),y:+n.getAttribute('y'),label:n.getAttribute('label')||'auto'}]))}
function readLines(x){return[...x.querySelectorAll('line')].map((n,i)=>({id:n.getAttribute('id')||`L${i+1}`,name:n.getAttribute('name')||n.getAttribute('id')||`Línea ${i+1}`,color:n.getAttribute('color')||'#64748b',width:+n.getAttribute('width')||10,radius:+n.getAttribute('radius')||18,stops:[...n.querySelectorAll('stop')].map(s=>{let serve=(s.getAttribute('serve')||s.getAttribute('direction')||'both').toLowerCase();if((s.getAttribute('calls')||'').toLowerCase()==='false')serve='none';return{station:s.getAttribute('station'),serve}})})).filter(l=>l.stops.length>1)}
function buildEdges(){const m=new Map;for(const l of lines)l.stops.slice(0,-1).forEach((s,i)=>{const k=key(s.station,l.stops[i+1].station);if(!m.has(k))m.set(k,[]);m.get(k).push(l.id)});for(const ids of m.values())ids.sort();return m}
function offsetPoint(l,i){const s=stations.get(l.stops[i].station),v=[];if(i){const p=stations.get(l.stops[i-1].station),ids=edgeMap.get(key(p.id,s.id))||[l.id];v.push({n:normal(p,s),d:(ids.indexOf(l.id)-(ids.length-1)/2)*(l.width+5)})}if(i<l.stops.length-1){const p=stations.get(l.stops[i+1].station),ids=edgeMap.get(key(s.id,p.id))||[l.id];v.push({n:normal(s,p),d:(ids.indexOf(l.id)-(ids.length-1)/2)*(l.width+5)})}return{x:s.x+v.reduce((q,o)=>q+o.n.x*o.d,0)/(v.length||1),y:s.y+v.reduce((q,o)=>q+o.n.y*o.d,0)/(v.length||1)}}
const ANGLES=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360].map(a=>a*Math.PI/180);
function schematicSegment(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<1)return[a,b];let ang=Math.atan2(dy,dx);if(ang<0)ang+=Math.PI*2;let exact=ANGLES.reduce((z,q)=>Math.abs(q-ang)<Math.abs(z-ang)?q:z,ANGLES[0]);if(Math.abs(exact-ang)<.035)return[a,b];let hi=ANGLES.find(q=>q>ang);if(hi===undefined)hi=Math.PI*2;let idx=ANGLES.indexOf(hi),lo=ANGLES[Math.max(0,idx-1)];const u={x:Math.cos(lo),y:Math.sin(lo)},v={x:Math.cos(hi),y:Math.sin(hi)},det=u.x*v.y-u.y*v.x;let A=(dx*v.y-dy*v.x)/det,B=(u.x*dy-u.y*dx)/det;if(A<0||B<0)return[a,b];const first=A>=B?{x:a.x+A*u.x,y:a.y+A*u.y}:{x:a.x+B*v.x,y:a.y+B*v.y};return[a,first,b]}
function routePoints(l){const anchors=l.stops.map((_,i)=>offsetPoint(l,i)),out=[anchors[0]];for(let i=0;i<anchors.length-1;i++){const seg=schematicSegment(anchors[i],anchors[i+1]);out.push(...seg.slice(1))}return out.filter((p,i,a)=>!i||Math.hypot(p.x-a[i-1].x,p.y-a[i-1].y)>.1)}
function roundedPath(points,radius){if(points.length<2)return'';let d=`M${points[0].x} ${points[0].y}`;for(let i=1;i<points.length-1;i++){const a=points[i-1],b=points[i],c=points[i+1],ab=Math.hypot(b.x-a.x,b.y-a.y),bc=Math.hypot(c.x-b.x,c.y-b.y),r=Math.min(radius,ab/2,bc/2),u1=unit(b,a),u2=unit(b,c),p1={x:b.x+u1.x*r,y:b.y+u1.y*r},p2={x:b.x+u2.x*r,y:b.y+u2.y*r};d+=` L${p1.x} ${p1.y} Q${b.x} ${b.y} ${p2.x} ${p2.y}`}const z=points.at(-1);return d+` L${z.x} ${z.y}`}
function localDirection(l,i){const p=offsetPoint(l,i),prev=i?offsetPoint(l,i-1):null,next=i<l.stops.length-1?offsetPoint(l,i+1):null;return prev&&next?unit(prev,next):unit(prev||p,next||p)}
function arrow(g,p,v,color,side){const u={x:v.x*side,y:v.y*side},n={x:-u.y,y:u.x},b={x:p.x-u.x*14,y:p.y-u.y*14};g.append(E('polygon',{points:`${p.x+u.x*15},${p.y+u.y*15} ${b.x+n.x*10},${b.y+n.y*10} ${b.x+n.x*4},${b.y+n.y*4} ${p.x-u.x*3},${p.y-u.y*3} ${b.x-n.x*4},${b.y-n.y*4} ${b.x-n.x*10},${b.y-n.y*10}`,fill:color}))}
function marker(g,l,i){const st=l.stops[i];if(st.serve==='none')return;const p=offsetPoint(l,i),v=localDirection(l,i);if(st.serve==='forward')arrow(g,p,v,l.color,1);else if(st.serve==='reverse')arrow(g,p,v,l.color,-1);g.append(E('circle',{cx:p.x,cy:p.y,r:9,stroke:l.color,'class':'stop-ring'}))}
function render(){view.replaceChildren();edgeMap=buildEdges();const rg=E('g'),sg=E('g');view.append(rg,sg);for(const l of lines){const d=roundedPath(routePoints(l),l.radius),g=E('g',{'class':'route','data-id':l.id});g.append(E('path',{d,'stroke-width':l.width+7,'class':'route-halo'}),E('path',{d,stroke:l.color,'stroke-width':l.width,'class':'route-line'}));l.stops.forEach((_,i)=>marker(g,l,i));rg.append(g)}for(const s of stations.values()){const uses=lines.flatMap(l=>l.stops.map((p,i)=>p.station===s.id?{...p,line:l,index:i}:null).filter(Boolean)),g=E('g',{'class':'station','data-id':s.id,'data-name':s.name.toLocaleLowerCase('es')});const side=s.label==='auto'?(s.y<(bounds.minY+bounds.maxY)/2?'top':'bottom'):s.label,pos={top:[s.x,s.y-30,'middle'],bottom:[s.x,s.y+43,'middle'],left:[s.x-29,s.y+6,'end'],right:[s.x+29,s.y+6,'start']}[side]||[s.x,s.y-30,'middle'];g.append(E('text',{x:pos[0],y:pos[1],'text-anchor':pos[2],'class':'label'},s.name));const h=E('circle',{cx:s.x,cy:s.y,r:27,'class':'station-hit'});h.onpointermove=e=>showTip(e,s,uses);h.onpointerleave=()=>tip.hidden=true;g.append(h);sg.append(g)}buildLegend();transform()}
function showTip(e,s,u){const names=t=>u.filter(x=>x.serve===t).map(x=>x.line.name),both=names('both'),f=names('forward'),r=names('reverse'),none=names('none');tip.innerHTML=`<b>${esc(s.name)}</b>${both.length?`<br><small>Paran en ambos sentidos: ${esc(both.join(', '))}</small>`:''}${f.length?`<br><small>Solo sentido de la línea: ${esc(f.join(', '))}</small>`:''}${r.length?`<br><small>Solo sentido contrario: ${esc(r.join(', '))}</small>`:''}${none.length?`<br><small>Pasan sin parar: ${esc(none.join(', '))}</small>`:''}`;const q=stage.getBoundingClientRect();tip.style.left=Math.min(e.clientX-q.left+12,q.width-290)+'px';tip.style.top=Math.min(e.clientY-q.top+12,q.height-135)+'px';tip.hidden=false}
function buildLegend(){legend.querySelectorAll('button').forEach(x=>x.remove());for(const l of lines){const b=document.createElement('button');b.innerHTML=`<i class="swatch" style="background:${esc(l.color)}"></i>${esc(l.name)}`;b.onclick=()=>{const rs=[...document.querySelectorAll('.route')],selected=rs.find(x=>x.dataset.id===l.id),clear=selected&&!selected.classList.contains('dim')&&rs.some(x=>x.classList.contains('dim'));rs.forEach(x=>x.classList.toggle('dim',clear?false:x.dataset.id!==l.id));const ids=new Set(l.stops.map(x=>x.station));document.querySelectorAll('.station').forEach(x=>x.classList.toggle('dim',clear?false:!ids.has(x.dataset.id)))};legend.append(b)}}
function calc(){const a=[...stations.values()],xs=a.map(x=>x.x),ys=a.map(x=>x.y);bounds={minX:Math.min(...xs)-140,maxX:Math.max(...xs)+140,minY:Math.min(...ys)-110,maxY:Math.max(...ys)+110}}function fit(){const w=stage.clientWidth,h=stage.clientHeight,bw=bounds.maxX-bounds.minX,bh=bounds.maxY-bounds.minY;cam.s=Math.max(.18,Math.min(4,Math.min((w-50)/bw,(h-50)/bh)));cam.x=(w-bw*cam.s)/2-bounds.minX*cam.s;cam.y=(h-bh*cam.s)/2-bounds.minY*cam.s;transform()}function transform(){view.setAttribute('transform',`translate(${cam.x} ${cam.y}) scale(${cam.s})`)}function zoom(k,x=stage.clientWidth/2,y=stage.clientHeight/2){const ns=Math.max(.18,Math.min(5,cam.s*k)),wx=(x-cam.x)/cam.s,wy=(y-cam.y)/cam.s;cam.x=x-wx*ns;cam.y=y-wy*ns;cam.s=ns;transform()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')};svg.onpointermove=e=>{if(drag){cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;transform()}};svg.onpointerup=e=>{drag=null;svg.releasePointerCapture(e.pointerId);svg.classList.remove('dragging')};$('#in').onclick=()=>zoom(1.25);$('#out').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#search').oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase('es');document.querySelectorAll('.station').forEach(x=>x.classList.toggle('match',q&&x.dataset.name.includes(q)))};window.onresize=fit;
(async()=>{try{const[a,b]=await Promise.all([load('stations.xml'),load('lines.xml')]);stations=readStations(a);lines=readLines(b);if(!stations.size)throw Error('No hay estaciones');const missing=lines.flatMap(l=>l.stops).filter(s=>!stations.has(s.station)).map(s=>s.station);if(missing.length)throw Error('Estaciones no definidas: '+[...new Set(missing)].join(', '));calc();render();requestAnimationFrame(fit);status.hidden=true}catch(e){status.innerHTML=`<b>No se pudo cargar el mapa</b><br>${esc(e.message)}<br><small>Ábrelo mediante HTTP, no con file://</small>`;console.error(e)}})();})();
</script></body></html>
