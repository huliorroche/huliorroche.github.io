<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailMap</title><style>
:root{--bg:#f5f7fb;--ink:#111827;--panel:#fffffff2;--border:#d6dbe5;--grid:#0f17240b}@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--ink:#f8fafc;--panel:#111827f2;--border:#334155;--grid:#ffffff0b}}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}.app{height:100%;display:grid;grid-template-rows:60px 1fr}.bar{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:2}.brand{font-weight:850;font-size:20px;margin-right:auto}.brand span{color:#4f46e5}.bar input,.bar button{height:38px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--ink);padding:0 12px}.bar input{width:min(290px,34vw)}.bar button{cursor:pointer}.bar .primary{background:var(--ink);color:var(--bg)}.stage{position:relative;overflow:hidden;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);background-size:24px 24px}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}svg.dragging{cursor:grabbing}.halo,.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.halo{stroke:var(--bg)}.label{fill:var(--ink);font-size:16px;font-weight:750;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}.ring{fill:var(--bg);stroke-width:6}.hit{fill:transparent}.route.dim,.station.dim{opacity:.12}.station.match .label{fill:#f59e0b}.legend{position:absolute;left:16px;bottom:16px;padding:10px;width:250px;max-height:38%;overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 16px 40px #0f172426}.legend h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin:2px 6px 7px}.legend button{display:flex;width:100%;gap:9px;align-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink);padding:8px;cursor:pointer}.sw{width:28px;height:7px;border-radius:9px}.status,.tip{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 13px;box-shadow:0 12px 36px #0f17242e;font-size:13px}.status{top:14px;left:50%;transform:translateX(-50%)}.tip{pointer-events:none;max-width:280px}.status[hidden],.tip[hidden]{display:none}@media(max-width:680px){.bar input{position:absolute;top:68px;left:12px;width:calc(100% - 24px);z-index:4;background:var(--panel)}}
</style></head><body><main class="app"><header class="bar"><div class="brand"><span>Rail</span>Map</div><input id="search" placeholder="Buscar estación…"><button id="out">−</button><button id="in">+</button><button id="fit" class="primary">Centrar</button></header><section id="stage" class="stage"><svg id="map"><g id="view"></g></svg><div id="status" class="status">Cargando…</div><aside id="legend" class="legend"><h2>Líneas</h2></aside><div id="tip" class="tip" hidden></div></section></main><script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#map'),view=$('#view'),stage=$('#stage'),legend=$('#legend'),status=$('#status'),tip=$('#tip');let stations=new Map,lines=[],edgeLines=new Map,ports=new Map,bounds,cam={x:0,y:0,s:1},drag;
const el=(n,a={},t='')=>{const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(t)e.textContent=t;return e},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),edgeKey=(a,b)=>[a,b].sort().join('|'),dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y),unit=(a,b)=>{const d=dist(a,b)||1;return{x:(b.x-a.x)/d,y:(b.y-a.y)/d}},normal=u=>({x:-u.y,y:u.x}),move=(p,u,d)=>({x:p.x+u.x*d,y:p.y+u.y*d});
async function loadXml(f){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(`${f}: HTTP ${r.status}`);const x=new DOMParser().parseFromString(await r.text(),'application/xml');if(x.querySelector('parsererror'))throw Error(`${f}: XML no válido`);return x}
function parseStations(x){return new Map([...x.querySelectorAll('station')].map(n=>[n.getAttribute('id'),{id:n.getAttribute('id'),name:n.getAttribute('name')||n.getAttribute('id'),x:+n.getAttribute('x'),y:+n.getAttribute('y'),label:n.getAttribute('label')||'auto'}]))}
function parseLines(x){return[...x.querySelectorAll('line')].map((n,i)=>({id:n.getAttribute('id')||`L${i}`,name:n.getAttribute('name')||n.getAttribute('id')||`Línea ${i+1}`,color:n.getAttribute('color')||'#64748b',width:+n.getAttribute('width')||10,radius:+n.getAttribute('radius')||16,stops:[...n.querySelectorAll('stop')].map(s=>{let serve=(s.getAttribute('serve')||'both').toLowerCase();if((s.getAttribute('calls')||'').toLowerCase()==='false')serve='none';return{station:s.getAttribute('station'),serve}})})).filter(l=>l.stops.length>1)}
function prepare(){edgeLines.clear();for(const l of lines)for(let i=0;i<l.stops.length-1;i++){const k=edgeKey(l.stops[i].station,l.stops[i+1].station);if(!edgeLines.has(k))edgeLines.set(k,[]);edgeLines.get(k).push(l.id)}for(const ids of edgeLines.values())ids.sort();ports.clear();for(const s of stations.values()){const ids=lines.filter(l=>l.stops.some(p=>p.station===s.id)).map(l=>l.id).sort();const maxW=Math.max(10,...ids.map(id=>lines.find(l=>l.id===id).width));const pitch=maxW+14;ids.forEach((id,i)=>ports.set(`${s.id}|${id}`,{x:s.x+(i-(ids.length-1)/2)*pitch,y:s.y}))}}
function laneOffset(line,a,b){const ids=edgeLines.get(edgeKey(a,b))||[line.id],A=stations.get(a),B=stations.get(b),n=normal(unit(A,B)),maxW=Math.max(...ids.map(id=>lines.find(l=>l.id===id).width)),pitch=maxW+14,d=(ids.indexOf(line.id)-(ids.length-1)/2)*pitch;return{x:n.x*d,y:n.y*d}}
function clean(points){const out=[];for(const p of points){const q=out.at(-1);if(!q||dist(q,p)>.8)out.push(p)}return out}
function edgePoints(line,i){
  const sa=stations.get(line.stops[i].station);
  const sb=stations.get(line.stops[i+1].station);
  const a=ports.get(`${sa.id}|${line.id}`);
  const b=ports.get(`${sb.id}|${line.id}`);
  const off=laneOffset(line,sa.id,sb.id);
  const u=unit(sa,sb);
  const lead=Math.min(38,dist(sa,sb)*.20);
  const corridorStart={x:sa.x+off.x+u.x*lead,y:sa.y+off.y+u.y*lead};
  const corridorEnd={x:sb.x+off.x-u.x*lead,y:sb.y+off.y-u.y*lead};
  return clean([a,corridorStart,corridorEnd,b]);
}
function polylinePath(points){
  if(points.length<2)return'';
  return `M${points.map((p,i)=>`${i?'L':''}${p.x} ${p.y}`).join(' ')}`;
}
function linePath(line){
  /* Geometría deliberadamente estable: cada enlace tiene dos conectores
     rectos y un corredor central. No se aplican Bézier ni redondeos
     automáticos cerca de las estaciones. */
  return line.stops.slice(0,-1)
    .map((_,i)=>polylinePath(edgePoints(line,i)))
    .join(' ');
}
function directionAt(line,i){if(i<line.stops.length-1){const p=edgePoints(line,i);return unit(p[0],p[1])}const p=edgePoints(line,i-1);return unit(p.at(-2),p.at(-1))}
function arrow(g,p,v,color,side){const u={x:v.x*side,y:v.y*side},n=normal(u),b=move(p,u,-14);g.append(el('polygon',{points:`${p.x+u.x*15},${p.y+u.y*15} ${b.x+n.x*10},${b.y+n.y*10} ${b.x+n.x*4},${b.y+n.y*4} ${p.x-u.x*3},${p.y-u.y*3} ${b.x-n.x*4},${b.y-n.y*4} ${b.x-n.x*10},${b.y-n.y*10}`,fill:color}))}
function marker(g,line,i){const stop=line.stops[i];if(stop.serve==='none')return;const p=ports.get(`${stop.station}|${line.id}`),v=directionAt(line,i);if(stop.serve==='forward')arrow(g,p,v,line.color,1);if(stop.serve==='reverse')arrow(g,p,v,line.color,-1);g.append(el('circle',{cx:p.x,cy:p.y,r:9,stroke:line.color,'class':'ring'}))}
function render(){view.replaceChildren();prepare();const routes=el('g'),nodes=el('g');view.append(routes,nodes);for(const line of lines){const d=linePath(line),g=el('g',{'class':'route','data-id':line.id});g.append(el('path',{d,'stroke-width':line.width+6,'class':'halo'}),el('path',{d,stroke:line.color,'stroke-width':line.width,'class':'line'}));line.stops.forEach((_,i)=>marker(g,line,i));routes.append(g)}for(const s of stations.values()){const g=el('g',{'class':'station','data-id':s.id,'data-name':s.name.toLowerCase()}),side=s.label==='auto'?'top':s.label,pos={top:[s.x,s.y-36,'middle'],bottom:[s.x,s.y+48,'middle'],left:[s.x-38,s.y+6,'end'],right:[s.x+38,s.y+6,'start']}[side];g.append(el('text',{x:pos[0],y:pos[1],'text-anchor':pos[2],'class':'label'},s.name));const h=el('circle',{cx:s.x,cy:s.y,r:36,'class':'hit'});h.onpointermove=e=>showTip(e,s);h.onpointerleave=()=>tip.hidden=true;g.append(h);nodes.append(g)}buildLegend()}
function showTip(e,s){const use=lines.flatMap(l=>l.stops.filter(x=>x.station===s.id).map(x=>({...x,line:l}))),n=t=>use.filter(x=>x.serve===t).map(x=>x.line.name);tip.innerHTML=`<b>${esc(s.name)}</b>${n('both').length?`<br><small>Ambos sentidos: ${esc(n('both').join(', '))}</small>`:''}${n('forward').length?`<br><small>Solo sentido de línea: ${esc(n('forward').join(', '))}</small>`:''}${n('reverse').length?`<br><small>Solo sentido contrario: ${esc(n('reverse').join(', '))}</small>`:''}${n('none').length?`<br><small>Pasan sin parar: ${esc(n('none').join(', '))}</small>`:''}`;const r=stage.getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+12,r.width-290)+'px';tip.style.top=Math.min(e.clientY-r.top+12,r.height-135)+'px';tip.hidden=false}
function buildLegend(){legend.querySelectorAll('button').forEach(x=>x.remove());for(const l of lines){const b=document.createElement('button');b.innerHTML=`<i class="sw" style="background:${esc(l.color)}"></i>${esc(l.name)}`;b.onclick=()=>{const rs=[...document.querySelectorAll('.route')],selected=rs.find(x=>x.dataset.id===l.id),clear=selected&&!selected.classList.contains('dim')&&rs.some(x=>x.classList.contains('dim'));rs.forEach(x=>x.classList.toggle('dim',clear?false:x.dataset.id!==l.id))};legend.append(b)}}
function calcBounds(){const a=[...stations.values()],xs=a.map(x=>x.x),ys=a.map(x=>x.y);bounds={minX:Math.min(...xs)-170,maxX:Math.max(...xs)+170,minY:Math.min(...ys)-130,maxY:Math.max(...ys)+130}}function transform(){view.setAttribute('transform',`translate(${cam.x} ${cam.y}) scale(${cam.s})`)}function fit(){const w=stage.clientWidth,h=stage.clientHeight,bw=bounds.maxX-bounds.minX,bh=bounds.maxY-bounds.minY;cam.s=Math.min((w-50)/bw,(h-50)/bh);cam.x=(w-bw*cam.s)/2-bounds.minX*cam.s;cam.y=(h-bh*cam.s)/2-bounds.minY*cam.s;transform()}function zoom(k,x=stage.clientWidth/2,y=stage.clientHeight/2){const ns=Math.max(.18,Math.min(5,cam.s*k)),wx=(x-cam.x)/cam.s,wy=(y-cam.y)/cam.s;cam.x=x-wx*ns;cam.y=y-wy*ns;cam.s=ns;transform()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')};svg.onpointermove=e=>{if(drag){cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;transform()}};svg.onpointerup=()=>{drag=null;svg.classList.remove('dragging')};$('#in').onclick=()=>zoom(1.25);$('#out').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.station').forEach(x=>x.classList.toggle('match',q&&x.dataset.name.includes(q)))};window.onresize=fit;
(async()=>{try{const[a,b]=await Promise.all([loadXml('stations.xml'),loadXml('lines.xml')]);stations=parseStations(a);lines=parseLines(b);const missing=lines.flatMap(l=>l.stops).filter(x=>!stations.has(x.station));if(missing.length)throw Error('Hay estaciones no definidas');calcBounds();render();requestAnimationFrame(fit);status.hidden=true}catch(e){status.innerHTML=`<b>No se pudo cargar</b><br>${esc(e.message)}`;console.error(e)}})()})();
</script></body></html>
