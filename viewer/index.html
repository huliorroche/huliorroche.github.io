<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailMap · Visor esquemático</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef2f7;
      --panel: rgba(255,255,255,.92);
      --panel-border: rgba(15,23,42,.10);
      --text: #101827;
      --muted: #667085;
      --grid: rgba(15,23,42,.055);
      --station: #fff;
      --station-border: #172033;
      --shadow: 0 18px 50px rgba(15,23,42,.14);
      --button: #111827;
      --button-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --panel: rgba(17,24,39,.92);
        --panel-border: rgba(255,255,255,.12);
        --text: #f6f7fb;
        --muted: #a7b0c0;
        --grid: rgba(255,255,255,.05);
        --station: #111827;
        --station-border: #f7f8fc;
        --shadow: 0 18px 60px rgba(0,0,0,.38);
        --button: #f8fafc;
        --button-text: #111827;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr); }
    .topbar {
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: max-content; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      color: #fff; font-weight: 900;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      box-shadow: 0 8px 20px rgba(79,70,229,.28);
    }
    .brand-title { font-weight: 820; letter-spacing: -.03em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .search {
      width: min(310px, 30vw); height: 38px;
      padding: 0 13px; border: 1px solid var(--panel-border);
      border-radius: 11px; color: var(--text); background: transparent; outline: none;
    }
    .search:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.14); }
    .btn {
      height: 38px; min-width: 38px; padding: 0 12px;
      border: 1px solid var(--panel-border); border-radius: 11px;
      color: var(--text); background: transparent; cursor: pointer;
    }
    .btn:hover { background: rgba(127,127,127,.10); }
    .btn.primary { border-color: var(--button); color: var(--button-text); background: var(--button); }
    .stage {
      position: relative; min-height: 0; overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #map.dragging { cursor: grabbing; }
    .line-halo { fill: none; stroke: var(--bg); stroke-linecap: round; stroke-linejoin: round; }
    .line-path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .station-box { fill: var(--station); stroke: var(--station-border); stroke-width: 2.2; }
    .station-dot { stroke: var(--station); stroke-width: 2.4; }
    .station-label {
      fill: var(--text); font-size: 14px; font-weight: 730;
      paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round;
      pointer-events: none;
    }
    .station-hit { fill: transparent; cursor: pointer; }
    .station.is-match .station-box { stroke: #f59e0b; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(245,158,11,.5)); }
    .station.is-dim, .route.is-dim { opacity: .12; }
    .station, .route { transition: opacity .18s ease; }
    .legend {
      position: absolute; left: 16px; bottom: 16px; z-index: 4;
      width: min(280px, calc(100% - 32px)); max-height: 42%; overflow: auto;
      padding: 12px; border: 1px solid var(--panel-border); border-radius: 16px;
      background: var(--panel); backdrop-filter: blur(18px); box-shadow: var(--shadow);
    }
    .legend-title { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
    .legend-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 10px; color: var(--text); background: transparent; cursor: pointer; text-align: left; }
    .legend-item:hover { background: rgba(127,127,127,.1); }
    .swatch { flex: 0 0 auto; width: 28px; height: 7px; border-radius: 999px; }
    .line-code { margin-left: auto; color: var(--muted); font-size: 11px; }
    .status {
      position: absolute; top: 14px; left: 50%; z-index: 7; transform: translateX(-50%);
      max-width: min(560px,calc(100% - 28px)); padding: 10px 14px;
      border: 1px solid var(--panel-border); border-radius: 12px; background: var(--panel);
      box-shadow: var(--shadow); font-size: 13px; text-align: center;
    }
    .status[hidden] { display: none; }
    .tooltip {
      position: absolute; z-index: 8; width: max-content; max-width: 260px;
      padding: 10px 12px; border: 1px solid var(--panel-border); border-radius: 12px;
      background: var(--panel); box-shadow: var(--shadow); pointer-events: none;
      font-size: 13px; transform: translate(12px,12px);
    }
    .tooltip strong { display: block; margin-bottom: 4px; }
    .tooltip small { color: var(--muted); }
    .tooltip[hidden] { display: none; }
    @media (max-width: 720px) {
      .brand-subtitle { display: none; }
      .search { position: absolute; top: 64px; left: 12px; width: calc(100% - 24px); z-index: 8; background: var(--panel); }
      .topbar { gap: 8px; }
      .toolbar { gap: 5px; }
      .btn { padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div><div class="brand-title">RailMap</div><div class="brand-subtitle">Red ferroviaria esquemática</div></div>
      </div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Buscar estación…" aria-label="Buscar estación">
        <button id="zoomOut" class="btn" type="button" title="Alejar">−</button>
        <button id="zoomIn" class="btn" type="button" title="Acercar">+</button>
        <button id="reset" class="btn primary" type="button">Centrar</button>
      </div>
    </header>
    <section id="stage" class="stage">
      <svg id="map" role="img" aria-label="Mapa ferroviario esquemático">
        <g id="viewport"></g>
      </svg>
      <div id="status" class="status">Cargando stations.xml y lines.xml…</div>
      <aside id="legend" class="legend" aria-label="Líneas"><h2 class="legend-title">Líneas</h2></aside>
      <div id="tooltip" class="tooltip" hidden></div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';
    const NS = 'http://www.w3.org/2000/svg';
    const $ = s => document.querySelector(s);
    const svg = $('#map'), viewport = $('#viewport'), stage = $('#stage');
    const statusBox = $('#status'), legend = $('#legend'), tooltip = $('#tooltip');
    let stations = new Map(), lines = [], bounds = null;
    let view = { x: 0, y: 0, scale: 1 }, drag = null;

    const el = (name, attrs = {}, text = '') => {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
      if (text) node.textContent = text;
      return node;
    };
    const num = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const normal = (a,b) => { const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1; return {x:-dy/d,y:dx/d}; };
    const add = (p,n,d) => ({x:p.x+n.x*d,y:p.y+n.y*d});

    async function loadXml(name) {
      const response = await fetch(name, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
      const text = await response.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const err = xml.querySelector('parsererror');
      if (err) throw new Error(`${name}: XML no válido`);
      return xml;
    }

    function parseStations(xml) {
      const map = new Map();
      xml.querySelectorAll('station').forEach(n => {
        const id=n.getAttribute('id');
        if (!id) return;
        map.set(id, {
          id, name:n.getAttribute('name')||id,
          x:num(n.getAttribute('x')), y:num(n.getAttribute('y')),
          label:n.getAttribute('label')||'auto'
        });
      });
      return map;
    }

    function parseLines(xml) {
      return [...xml.querySelectorAll('line')].map((n,index) => ({
        id:n.getAttribute('id')||`line-${index+1}`,
        name:n.getAttribute('name')||n.getAttribute('id')||`Línea ${index+1}`,
        color:n.getAttribute('color')||'#64748b',
        width:num(n.getAttribute('width'),10),
        stops:[...n.querySelectorAll('stop')].map(s => ({
          station:s.getAttribute('station'),
          calls:(s.getAttribute('calls')||'true').toLowerCase()!=='false'
        })).filter(s => s.station)
      })).filter(l => l.stops.length > 1);
    }

    function buildEdges() {
      const edges = new Map();
      for (const line of lines) {
        line.stops.forEach((stop,i) => {
          if (i===line.stops.length-1) return;
          const a=stop.station,b=line.stops[i+1].station;
          const key=[a,b].sort().join('|');
          if (!edges.has(key)) edges.set(key,[]);
          edges.get(key).push(line.id);
        });
      }
      for (const ids of edges.values()) ids.sort((a,b)=>a.localeCompare(b));
      return edges;
    }

    function routePoints(line, edges) {
      return line.stops.map((stop,i) => {
        const station=stations.get(stop.station);
        if (!station) return null;
        let offsets=[];
        if (i>0) {
          const prev=stations.get(line.stops[i-1].station);
          if (prev) {
            const ids=edges.get([prev.id,station.id].sort().join('|'))||[line.id];
            offsets.push({n:normal(prev,station),d:(ids.indexOf(line.id)-(ids.length-1)/2)*(line.width+4)});
          }
        }
        if (i<line.stops.length-1) {
          const next=stations.get(line.stops[i+1].station);
          if (next) {
            const ids=edges.get([station.id,next.id].sort().join('|'))||[line.id];
            offsets.push({n:normal(station,next),d:(ids.indexOf(line.id)-(ids.length-1)/2)*(line.width+4)});
          }
        }
        if (!offsets.length) return {x:station.x,y:station.y};
        const ox=offsets.reduce((s,o)=>s+o.n.x*o.d,0)/offsets.length;
        const oy=offsets.reduce((s,o)=>s+o.n.y*o.d,0)/offsets.length;
        return {x:station.x+ox,y:station.y+oy};
      }).filter(Boolean);
    }

    function smoothPath(points) {
      if (points.length<2) return '';
      if (points.length===2) return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
      let d=`M ${points[0].x} ${points[0].y}`;
      for(let i=0;i<points.length-1;i++) {
        const p0=points[Math.max(0,i-1)], p1=points[i], p2=points[i+1], p3=points[Math.min(points.length-1,i+2)];
        const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6};
        const c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
        d+=` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
      }
      return d;
    }

    function stationGeometry(station, calls) {
      const stopping=calls.filter(c=>c.calls);
      const through=calls.filter(c=>!c.calls);
      const lineGap=14;
      const width=Math.max(31,stopping.length*lineGap+16);
      const height=28;
      return {stopping,through,width,height,x:station.x-width/2,y:station.y-height/2};
    }

    function render() {
      viewport.replaceChildren();
      const edges=buildEdges();
      const routesLayer=el('g'), stationsLayer=el('g');
      viewport.append(routesLayer,stationsLayer);

      for (const line of lines) {
        const d=smoothPath(routePoints(line,edges));
        const g=el('g',{'class':'route','data-line':line.id});
        g.append(el('path',{d,'class':'line-halo','stroke-width':line.width+7}));
        g.append(el('path',{d,'class':'line-path',stroke:line.color,'stroke-width':line.width}));
        routesLayer.append(g);
      }

      stations.forEach(station => {
        const calls=lines.flatMap(line=>line.stops.filter(s=>s.station===station.id).map(s=>({...s,line})));
        const geo=stationGeometry(station,calls);
        const g=el('g',{'class':'station','data-name':station.name.toLocaleLowerCase('es')});
        // Las líneas pasantes quedan visibles fuera de la cápsula blanca.
        for (const c of geo.through) g.append(el('circle',{cx:station.x,cy:station.y,r:4.2,fill:c.line.color,'class':'station-dot'}));
        if (geo.stopping.length) {
          g.append(el('rect',{x:geo.x,y:geo.y,width:geo.width,height:geo.height,rx:14,'class':'station-box'}));
          geo.stopping.forEach((c,i)=>{
            const cx=station.x+(i-(geo.stopping.length-1)/2)*14;
            g.append(el('circle',{cx,cy:station.y,r:4.7,fill:c.line.color,'class':'station-dot'}));
          });
        } else {
          g.append(el('circle',{cx:station.x,cy:station.y,r:5.5,fill:'var(--station)','class':'station-box'}));
        }
        const side=station.label==='auto' ? (station.y<((bounds.minY+bounds.maxY)/2)?'top':'bottom') : station.label;
        const pos={top:{x:station.x,y:geo.y-11,a:'middle'},bottom:{x:station.x,y:geo.y+geo.height+22,a:'middle'},left:{x:geo.x-12,y:station.y+5,a:'end'},right:{x:geo.x+geo.width+12,y:station.y+5,a:'start'}}[side]||{x:station.x,y:geo.y-11,a:'middle'};
        g.append(el('text',{x:pos.x,y:pos.y,'text-anchor':pos.a,'class':'station-label'},station.name));
        const hit=el('rect',{x:geo.x-12,y:geo.y-30,width:geo.width+24,height:geo.height+60,rx:18,'class':'station-hit'});
        hit.addEventListener('pointermove',e=>showTooltip(e,station,calls));
        hit.addEventListener('pointerleave',()=>tooltip.hidden=true);
        g.append(hit); stationsLayer.append(g);
      });
      buildLegend(); updateTransform();
    }

    function showTooltip(e,station,calls) {
      const stopping=calls.filter(c=>c.calls).map(c=>c.line.name);
      const through=calls.filter(c=>!c.calls).map(c=>c.line.name);
      tooltip.innerHTML=`<strong>${escapeHtml(station.name)}</strong>`+
        (stopping.length?`<small>Paran: ${escapeHtml(stopping.join(', '))}</small>`:'')+
        (through.length?`<br><small>Pasantes: ${escapeHtml(through.join(', '))}</small>`:'');
      const r=stage.getBoundingClientRect(); tooltip.style.left=`${Math.min(e.clientX-r.left,r.width-270)}px`; tooltip.style.top=`${Math.min(e.clientY-r.top,r.height-100)}px`; tooltip.hidden=false;
    }

    function buildLegend() {
      legend.querySelectorAll('.legend-item').forEach(n=>n.remove());
      lines.forEach(line=>{
        const b=document.createElement('button'); b.type='button'; b.className='legend-item';
        b.innerHTML=`<span class="swatch" style="background:${escapeHtml(line.color)}"></span><span>${escapeHtml(line.name)}</span><span class="line-code">${escapeHtml(line.id)}</span>`;
        b.addEventListener('click',()=>focusLine(line.id)); legend.append(b);
      });
    }

    function focusLine(id) {
      const active=[...document.querySelectorAll('.route')].find(n=>n.dataset.line===id && !n.classList.contains('is-dim'));
      document.querySelectorAll('.route').forEach(n=>n.classList.toggle('is-dim',active ? false : n.dataset.line!==id));
      const stationIds=new Set((lines.find(l=>l.id===id)?.stops||[]).map(s=>s.station));
      document.querySelectorAll('.station').forEach(n=>{
        const st=[...stations.values()].find(s=>s.name.toLocaleLowerCase('es')===n.dataset.name);
        n.classList.toggle('is-dim',active ? false : !stationIds.has(st?.id));
      });
    }

    function calculateBounds() {
      const values=[...stations.values()];
      const xs=values.map(s=>s.x),ys=values.map(s=>s.y);
      bounds={minX:Math.min(...xs)-110,maxX:Math.max(...xs)+110,minY:Math.min(...ys)-90,maxY:Math.max(...ys)+90};
    }
    function fit() {
      if(!bounds) return;
      const w=stage.clientWidth,h=stage.clientHeight,pad=28;
      const bw=bounds.maxX-bounds.minX,bh=bounds.maxY-bounds.minY;
      view.scale=Math.min((w-pad*2)/bw,(h-pad*2)/bh);
      view.scale=Math.max(.15,Math.min(4,view.scale));
      view.x=(w-bw*view.scale)/2-bounds.minX*view.scale;
      view.y=(h-bh*view.scale)/2-bounds.minY*view.scale;
      updateTransform();
    }
    function updateTransform(){ viewport.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.scale})`); }
    function zoomAt(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){
      const next=Math.max(.18,Math.min(5,view.scale*factor));
      const wx=(cx-view.x)/view.scale,wy=(cy-view.y)/view.scale;
      view.x=cx-wx*next; view.y=cy-wy*next; view.scale=next; updateTransform();
    }

    svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top);},{passive:false});
    svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');});
    svg.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;updateTransform();});
    svg.addEventListener('pointerup',e=>{drag=null;svg.releasePointerCapture(e.pointerId);svg.classList.remove('dragging');});
    $('#zoomIn').addEventListener('click',()=>zoomAt(1.25));
    $('#zoomOut').addEventListener('click',()=>zoomAt(.8));
    $('#reset').addEventListener('click',fit);
    $('#search').addEventListener('input',e=>{
      const q=e.target.value.trim().toLocaleLowerCase('es');
      document.querySelectorAll('.station').forEach(n=>n.classList.toggle('is-match',q.length>0&&n.dataset.name.includes(q)));
    });
    window.addEventListener('resize',fit);

    async function init() {
      try {
        const [stationsXml,linesXml]=await Promise.all([loadXml('stations.xml'),loadXml('lines.xml')]);
        stations=parseStations(stationsXml); lines=parseLines(linesXml);
        if(stations.size===0) throw new Error('stations.xml no contiene estaciones');
        const missing=lines.flatMap(l=>l.stops).filter(s=>!stations.has(s.station)).map(s=>s.station);
        if(missing.length) throw new Error(`Estaciones no definidas: ${[...new Set(missing)].join(', ')}`);
        calculateBounds(); render(); requestAnimationFrame(fit); statusBox.hidden=true;
      } catch (error) {
        statusBox.hidden=false;
        statusBox.innerHTML=`<strong>No se pudo cargar el mapa.</strong><br>${escapeHtml(error.message)}<br><small>Abre la carpeta mediante un servidor HTTP local, no con file://.</small>`;
        console.error(error);
      }
    }
    init();
  })();
  </script>
</body>
</html>
