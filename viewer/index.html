<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailMap</title><style>
:root{--bg:#f5f7fb;--ink:#111827;--panel:#fffffff2;--border:#d6dbe5;--grid:#0f17240b}@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--ink:#f8fafc;--panel:#111827f2;--border:#334155;--grid:#ffffff0b}}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}.app{height:100%;display:grid;grid-template-rows:60px 1fr}.bar{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:2}.brand{font-weight:850;font-size:20px;margin-right:auto}.brand span{color:#4f46e5}.bar input,.bar button{height:38px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--ink);padding:0 12px}.bar input{width:min(290px,34vw)}.bar button{cursor:pointer}.bar .primary{background:var(--ink);color:var(--bg)}.stage{position:relative;overflow:hidden;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);background-size:24px 24px}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}svg.dragging{cursor:grabbing}.halo,.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.halo{stroke:var(--bg)}.label{fill:var(--ink);font-size:16px;font-weight:750;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}.ring{fill:var(--bg);stroke-width:6}.hit{fill:transparent;cursor:pointer}.station.match .label{fill:#f59e0b}.route.dim,.station.dim{opacity:.12}.legend{position:absolute;left:16px;bottom:16px;width:min(260px,calc(100% - 32px));max-height:40%;overflow:auto;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 16px 40px #0f172426}.legend h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin:2px 6px 7px}.legend button{display:flex;width:100%;align-items:center;gap:9px;border:0;border-radius:9px;background:transparent;color:var(--ink);padding:8px;cursor:pointer}.legend button:hover{background:#7f7f7f18}.sw{width:28px;height:7px;border-radius:9px}.status,.tip{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:0 12px 36px #0f17242e;padding:10px 13px;font-size:13px}.status{top:14px;left:50%;transform:translateX(-50%);text-align:center}.tip{pointer-events:none;max-width:280px}.tip[hidden],.status[hidden]{display:none}.tip small{color:#64748b}@media(max-width:680px){.brand{font-size:17px}.bar input{position:absolute;top:68px;left:12px;width:calc(100% - 24px);z-index:4;background:var(--panel)}.bar{padding:10px}.bar button{padding:0 9px}}
</style></head><body><main class="app"><header class="bar"><div class="brand"><span>Rail</span>Map</div><input id="search" type="search" placeholder="Buscar estación…"><button id="out">−</button><button id="in">+</button><button id="fit" class="primary">Centrar</button></header><section id="stage" class="stage"><svg id="map"><g id="view"></g></svg><div id="status" class="status">Cargando mapa…</div><aside id="legend" class="legend"><h2>Líneas</h2></aside><div id="tip" class="tip" hidden></div></section></main><script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#map'),view=$('#view'),stage=$('#stage'),status=$('#status'),tip=$('#tip'),legend=$('#legend');let S=new Map,L=[],edges,bounds,cam={x:0,y:0,s:1},drag;
const E=(n,a={},t='')=>{const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t)e.textContent=t;return e},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),K=(a,b)=>[a,b].sort().join('|'),U=(a,b)=>{let x=b.x-a.x,y=b.y-a.y,d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}},N=(u)=>({x:-u.y,y:u.x}),P=(p,u,d)=>({x:p.x+u.x*d,y:p.y+u.y*d});
async function load(f){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(`${f}: HTTP ${r.status}`);const x=new DOMParser().parseFromString(await r.text(),'application/xml');if(x.querySelector('parsererror'))throw Error(`${f}: XML no válido`);return x}
function parseS(x){return new Map([...x.querySelectorAll('station')].map(n=>[n.getAttribute('id'),{id:n.getAttribute('id'),name:n.getAttribute('name')||n.getAttribute('id'),x:+n.getAttribute('x'),y:+n.getAttribute('y'),label:n.getAttribute('label')||'auto'}]))}
function parseL(x){return[...x.querySelectorAll('line')].map((n,i)=>({id:n.getAttribute('id')||`L${i+1}`,name:n.getAttribute('name')||n.getAttribute('id')||`Línea ${i+1}`,color:n.getAttribute('color')||'#64748b',width:+n.getAttribute('width')||10,radius:+n.getAttribute('radius')||18,lead:+n.getAttribute('lead')||38,stops:[...n.querySelectorAll('stop')].map(s=>{let serve=(s.getAttribute('serve')||'both').toLowerCase();if((s.getAttribute('calls')||'').toLowerCase()==='false')serve='none';return{station:s.getAttribute('station'),serve}})})).filter(l=>l.stops.length>1)}
function buildEdges(){const m=new Map;for(const l of L)l.stops.slice(0,-1).forEach((s,i)=>{const a=s.station,b=l.stops[i+1].station,k=K(a,b);if(!m.has(k))m.set(k,{a:[a,b].sort()[0],b:[a,b].sort()[1],lines:[]});m.get(k).lines.push(l.id)});for(const e of m.values())e.lines.sort();return m}
function edgeOffset(l,a,b){const e=edges.get(K(a,b)),sa=S.get(e.a),sb=S.get(e.b),u=U(sa,sb),n=N(u),idx=e.lines.indexOf(l.id),gap=l.width+6;return{x:n.x*(idx-(e.lines.length-1)/2)*gap,y:n.y*(idx-(e.lines.length-1)/2)*gap}}
const allowed=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330].map(x=>x*Math.PI/180);
function snapAngle(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return allowed.reduce((z,q)=>Math.abs(Math.atan2(Math.sin(q-a),Math.cos(q-a)))<Math.abs(Math.atan2(Math.sin(z-a),Math.cos(z-a)))?q:z)}
function corridor(a,b,lead){const raw=U(a,b),ang=snapAngle(Math.atan2(raw.y,raw.x)),u={x:Math.cos(ang),y:Math.sin(ang)},start=P(a,u,Math.min(lead,Math.hypot(b.x-a.x)/3)),end=P(b,u,-Math.min(lead,Math.hypot(b.x-a.x)/3));return{u,start,end}}
function edgeGeometry(l,i){const A=S.get(l.stops[i].station),B=S.get(l.stops[i+1].station),o=edgeOffset(l,A.id,B.id),a={x:A.x+o.x,y:A.y+o.y},b={x:B.x+o.x,y:B.y+o.y},c=corridor(a,b,l.lead);/* La línea sale recta de la estación; el cambio de ángulo ocurre después del lead. */const mid={x:c.end.x,y:c.start.y};const alt={x:c.start.x,y:c.end.y};const d1=Math.hypot(mid.x-c.start.x,mid.y-c.start.y)+Math.hypot(c.end.x-mid.x,c.end.y-mid.y),d2=Math.hypot(alt.x-c.start.x,alt.y-c.start.y)+Math.hypot(c.end.x-alt.x,c.end.y-alt.y);let bend=d1<=d2?mid:alt;return[a,c.start,bend,c.end,b].filter((p,j,a)=>!j||Math.hypot(p.x-a[j-1].x,p.y-a[j-1].y)>.5)}
function rounded(points,r){let d=`M${points[0].x} ${points[0].y}`;for(let i=1;i<points.length-1;i++){const a=points[i-1],b=points[i],c=points[i+1],ab=Math.hypot(b.x-a.x,b.y-a.y),bc=Math.hypot(c.x-b.x,c.y-b.y);if(ab<1||bc<1)continue;const rr=Math.min(r,ab*.42,bc*.42),p=P(b,U(b,a),rr),q=P(b,U(b,c),rr);d+=` L${p.x} ${p.y} Q${b.x} ${b.y} ${q.x} ${q.y}`}const z=points.at(-1);return d+` L${z.x} ${z.y}`}
function fullPath(l){let pts=[];for(let i=0;i<l.stops.length-1;i++){const p=edgeGeometry(l,i);pts.push(...(i?p.slice(1):p))}return rounded(pts,l.radius)}
function stationPoint(l,i){let offsets=[];if(i)offsets.push(edgeOffset(l,l.stops[i-1].station,l.stops[i].station));if(i<l.stops.length-1)offsets.push(edgeOffset(l,l.stops[i].station,l.stops[i+1].station));const s=S.get(l.stops[i].station);return{x:s.x+offsets.reduce((q,o)=>q+o.x,0)/(offsets.length||1),y:s.y+offsets.reduce((q,o)=>q+o.y,0)/(offsets.length||1)}}
function stationDir(l,i){const p=stationPoint(l,i),q=i<l.stops.length-1?edgeGeometry(l,i)[1]:edgeGeometry(l,i-1).at(-2);return U(i<l.stops.length-1?p:q,i<l.stops.length-1?q:p)}
function arrow(g,p,v,color,side){const u={x:v.x*side,y:v.y*side},n=N(u),b=P(p,u,-14);g.append(E('polygon',{points:`${p.x+u.x*15},${p.y+u.y*15} ${b.x+n.x*10},${b.y+n.y*10} ${b.x+n.x*4},${b.y+n.y*4} ${p.x-u.x*3},${p.y-u.y*3} ${b.x-n.x*4},${b.y-n.y*4} ${b.x-n.x*10},${b.y-n.y*10}`,fill:color}))}
function marker(g,l,i){const st=l.stops[i];if(st.serve==='none')return;const p=stationPoint(l,i),v=stationDir(l,i);if(st.serve==='forward')arrow(g,p,v,l.color,1);if(st.serve==='reverse')arrow(g,p,v,l.color,-1);g.append(E('circle',{cx:p.x,cy:p.y,r:9,stroke:l.color,'class':'ring'}))}
function render(){view.replaceChildren();edges=buildEdges();const rg=E('g'),sg=E('g');view.append(rg,sg);for(const l of L){const d=fullPath(l),g=E('g',{'class':'route','data-id':l.id});g.append(E('path',{d,'stroke-width':l.width+7,'class':'halo'}),E('path',{d,stroke:l.color,'stroke-width':l.width,'class':'line'}));l.stops.forEach((_,i)=>marker(g,l,i));rg.append(g)}for(const s of S.values()){const uses=L.flatMap(l=>l.stops.map((p,i)=>p.station===s.id?{...p,line:l,index:i}:null).filter(Boolean)),g=E('g',{'class':'station','data-id':s.id,'data-name':s.name.toLowerCase()});const side=s.label==='auto'?(s.y<(bounds.minY+bounds.maxY)/2?'top':'bottom'):s.label,pos={top:[s.x,s.y-30,'middle'],bottom:[s.x,s.y+43,'middle'],left:[s.x-30,s.y+6,'end'],right:[s.x+30,s.y+6,'start']}[side];g.append(E('text',{x:pos[0],y:pos[1],'text-anchor':pos[2],'class':'label'},s.name));const h=E('circle',{cx:s.x,cy:s.y,r:29,'class':'hit'});h.onpointermove=e=>showTip(e,s,uses);h.onpointerleave=()=>tip.hidden=true;g.append(h);sg.append(g)}buildLegend();transform()}
function showTip(e,s,u){const n=t=>u.filter(x=>x.serve===t).map(x=>x.line.name),a=n('both'),b=n('forward'),c=n('reverse'),d=n('none');tip.innerHTML=`<b>${esc(s.name)}</b>${a.length?`<br><small>Ambos sentidos: ${esc(a.join(', '))}</small>`:''}${b.length?`<br><small>Solo sentido de línea: ${esc(b.join(', '))}</small>`:''}${c.length?`<br><small>Solo sentido contrario: ${esc(c.join(', '))}</small>`:''}${d.length?`<br><small>Pasan sin parar: ${esc(d.join(', '))}</small>`:''}`;const q=stage.getBoundingClientRect();tip.style.left=Math.min(e.clientX-q.left+12,q.width-290)+'px';tip.style.top=Math.min(e.clientY-q.top+12,q.height-135)+'px';tip.hidden=false}
function buildLegend(){legend.querySelectorAll('button').forEach(x=>x.remove());for(const l of L){const b=document.createElement('button');b.innerHTML=`<i class="sw" style="background:${esc(l.color)}"></i>${esc(l.name)}`;b.onclick=()=>{const rs=[...document.querySelectorAll('.route')],sel=rs.find(x=>x.dataset.id===l.id),clear=sel&&!sel.classList.contains('dim')&&rs.some(x=>x.classList.contains('dim'));rs.forEach(x=>x.classList.toggle('dim',clear?false:x.dataset.id!==l.id));const ids=new Set(l.stops.map(x=>x.station));document.querySelectorAll('.station').forEach(x=>x.classList.toggle('dim',clear?false:!ids.has(x.dataset.id)))};legend.append(b)}}
function calc(){const a=[...S.values()],xs=a.map(x=>x.x),ys=a.map(x=>x.y);bounds={minX:Math.min(...xs)-150,maxX:Math.max(...xs)+150,minY:Math.min(...ys)-120,maxY:Math.max(...ys)+120}}function fit(){const w=stage.clientWidth,h=stage.clientHeight,bw=bounds.maxX-bounds.minX,bh=bounds.maxY-bounds.minY;cam.s=Math.max(.18,Math.min(4,Math.min((w-50)/bw,(h-50)/bh)));cam.x=(w-bw*cam.s)/2-bounds.minX*cam.s;cam.y=(h-bh*cam.s)/2-bounds.minY*cam.s;transform()}function transform(){view.setAttribute('transform',`translate(${cam.x} ${cam.y}) scale(${cam.s})`)}function zoom(k,x=stage.clientWidth/2,y=stage.clientHeight/2){const ns=Math.max(.18,Math.min(5,cam.s*k)),wx=(x-cam.x)/cam.s,wy=(y-cam.y)/cam.s;cam.x=x-wx*ns;cam.y=y-wy*ns;cam.s=ns;transform()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')};svg.onpointermove=e=>{if(drag){cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;transform()}};svg.onpointerup=e=>{drag=null;svg.releasePointerCapture(e.pointerId);svg.classList.remove('dragging')};$('#in').onclick=()=>zoom(1.25);$('#out').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.station').forEach(x=>x.classList.toggle('match',q&&x.dataset.name.includes(q)))};window.onresize=fit;
(async()=>{try{const[a,b]=await Promise.all([load('stations.xml'),load('lines.xml')]);S=parseS(a);L=parseL(b);const missing=L.flatMap(l=>l.stops).filter(s=>!S.has(s.station)).map(s=>s.station);if(!S.size)throw Error('No hay estaciones');if(missing.length)throw Error('Estaciones no definidas: '+[...new Set(missing)].join(', '));calc();render();requestAnimationFrame(fit);status.hidden=true}catch(e){status.innerHTML=`<b>No se pudo cargar el mapa</b><br>${esc(e.message)}<br><small>Ábrelo mediante HTTP, no con file://</small>`;console.error(e)}})()})();
</script></body></html>
