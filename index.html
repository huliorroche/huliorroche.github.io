<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #172033;
      --muted: #71809f;
      --glass: rgba(255, 255, 255, .78);
      --line: rgba(25, 42, 76, .12)
    }

    * {
      box-sizing: border-box
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 10%, #bcecff 0, transparent 28%), radial-gradient(circle at 88% 16%, #ffe8a3 0, transparent 25%), linear-gradient(135deg, #eef5ff, #f8f5ff 52%, #e8fff8);
      background-attachment: fixed
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background-image: linear-gradient(rgba(255, 255, 255, .5) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .5) 1px, transparent 1px);
      background-size: 42px 42px
    }

    .navbar,
    .glass {
      background: var(--glass) !important;
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(35, 52, 89, .14)
    }

    .brand-ball {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-block;
      background: linear-gradient(#ff5263 0 45%, #1b2441 46% 54%, #fff 55%);
      position: relative;
      box-shadow: 0 0 25px rgba(255, 82, 99, .4)
    }

    .brand-ball::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 3px solid #1b2441;
      border-radius: 50%;
      background: #fff;
      left: 12px;
      top: 12px
    }

    .form-control,
    .form-select {
      background-color: rgba(255, 255, 255, .82) !important;
      border-color: var(--line);
      color: var(--ink) !important
    }

    .form-control::placeholder {
      color: #8290aa
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #5dc8bf;
      box-shadow: 0 0 0 .2rem rgba(62, 230, 208, .15)
    }

    .btn-outline-secondary {
      border-color: rgba(60, 76, 109, .2);
      color: #526080
    }

    .pokemon-card {
      height: 100%;
      overflow: hidden;
      border-radius: 1.35rem;
      transition: .22s transform, .22s box-shadow;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(52, 67, 101, .12);
      cursor: pointer
    }

    .pokemon-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 44px rgba(52, 67, 101, .2)
    }

    .pokemon-card:focus-visible {
      outline: 3px solid rgba(62, 230, 208, .75);
      outline-offset: 3px
    }

    .art {
      --sky-top: #a8d8ff;
      --sky-bottom: #eaf7ff;
      --ground-top: #82c36b;
      --ground-bottom: #4c8d41;
      height: 245px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: radial-gradient(circle at 76% 20%, rgba(255, 255, 255, .92) 0 7%, rgba(255, 255, 255, .30) 8% 13%, transparent 14%), linear-gradient(to bottom, var(--sky-top) 0 64%, var(--sky-bottom) 64% 67%, var(--ground-top) 68%, var(--ground-bottom) 100%)
    }

    .art>img.pokemon-image {
      position: absolute;
      z-index: 2;
      height: 80%;
      max-width: 92%;
      object-fit: contain;
      filter: drop-shadow(0 18px 14px rgba(0, 0, 0, .30));
      transition: transform .25s
    }

    .pokemon-card:hover .art>img.pokemon-image {
      transform: scale(1.06)
    }

    .art::before {
      content: "";
      position: absolute;
      z-index: -2;
      left: -12%;
      right: -12%;
      bottom: 22%;
      height: 42%;
      opacity: .7;
      background: radial-gradient(ellipse at 12% 100%, rgba(255, 255, 255, .42) 0 30%, transparent 31%), radial-gradient(ellipse at 43% 100%, rgba(255, 255, 255, .32) 0 38%, transparent 39%), radial-gradient(ellipse at 82% 100%, rgba(255, 255, 255, .40) 0 34%, transparent 35%);
      filter: blur(1px)
    }

    .art::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 74%;
      height: 25px;
      left: 13%;
      bottom: 16px;
      border-radius: 50%;
      background: rgba(22, 38, 55, .18);
      filter: blur(8px)
    }

    .type-normal {
      --sky-top: #b9dcf1;
      --sky-bottom: #edf8fb;
      --ground-top: #9dbb80;
      --ground-bottom: #66885c
    }

    .type-fire {
      --sky-top: #ff9b62;
      --sky-bottom: #ffd6a4;
      --ground-top: #72534a;
      --ground-bottom: #342e35
    }

    .type-water {
      --sky-top: #71ccef;
      --sky-bottom: #d9f6ff;
      --ground-top: #3caec5;
      --ground-bottom: #176b91
    }

    .type-electric {
      --sky-top: #8ebeea;
      --sky-bottom: #f7e88b;
      --ground-top: #9e9852;
      --ground-bottom: #666431
    }

    .type-grass {
      --sky-top: #9fe0b4;
      --sky-bottom: #e5f8c8;
      --ground-top: #5ebf61;
      --ground-bottom: #286c43
    }

    .type-ice {
      --sky-top: #a8e7f7;
      --sky-bottom: #f4fdff;
      --ground-top: #c5edf6;
      --ground-bottom: #75b9cf
    }

    .type-fighting {
      --sky-top: #e7a16f;
      --sky-bottom: #f4cf9c;
      --ground-top: #b1714c;
      --ground-bottom: #623f32
    }

    .type-poison {
      --sky-top: #b69add;
      --sky-bottom: #d8c2ed;
      --ground-top: #84679a;
      --ground-bottom: #473651
    }

    .type-ground {
      --sky-top: #e2b86e;
      --sky-bottom: #f6dfae;
      --ground-top: #b9894c;
      --ground-bottom: #71502e
    }

    .type-flying {
      --sky-top: #77c9f4;
      --sky-bottom: #effbff;
      --ground-top: #a8c88d;
      --ground-bottom: #6c9662
    }

    .type-psychic {
      --sky-top: #df8fca;
      --sky-bottom: #f4c9e6;
      --ground-top: #8b6aa0;
      --ground-bottom: #4f446f
    }

    .type-bug {
      --sky-top: #b9d685;
      --sky-bottom: #e9f2b8;
      --ground-top: #789841;
      --ground-bottom: #3e5e28
    }

    .type-rock {
      --sky-top: #d2bc91;
      --sky-bottom: #eee2c5;
      --ground-top: #9c805f;
      --ground-bottom: #57483b
    }

    .type-ghost {
      --sky-top: #514f85;
      --sky-bottom: #8a78a8;
      --ground-top: #514760;
      --ground-bottom: #242439
    }

    .type-dragon {
      --sky-top: #6977bc;
      --sky-bottom: #c09bd2;
      --ground-top: #725b75;
      --ground-bottom: #3a3349
    }

    .type-dark {
      --sky-top: #45495c;
      --sky-bottom: #807986;
      --ground-top: #4b4749;
      --ground-bottom: #222227
    }

    .type-steel {
      --sky-top: #aebdca;
      --sky-bottom: #e4edf1;
      --ground-top: #8797a0;
      --ground-bottom: #4d5a61
    }

    .type-fairy {
      --sky-top: #f3a9d0;
      --sky-bottom: #ffe0ef;
      --ground-top: #c58fbc;
      --ground-bottom: #815f91
    }

    .card-info {
      background: rgba(255, 255, 255, .97)
    }

    .dex {
      color: #7791bd;
      font-weight: 800;
      letter-spacing: .08em
    }

    .poke-name {
      text-transform: capitalize;
      font-weight: 800
    }

    .poke-variant {
      margin-bottom: -10px;
      font-size: .82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #7d8db6
    }

    .poke-name-row,
    .poke-variant-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      column-gap: .45rem
    }

    .poke-variant-row {
      margin-bottom: -10px
    }

    .poke-variant-row .poke-variant {
      margin-bottom: 0
    }

    .poke-name-auxiliary {
      color: #8190ad;
      font-size: 1.25rem;
      font-weight: 300;
      letter-spacing: -.02em;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif
    }

    .poke-variant-auxiliary {
      color: #9aa5bc;
      font-size: .8rem;
      font-weight: 300;
      letter-spacing: -.02em;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif
    }

    .cp {
      font-size: 1.55rem;
      font-weight: 850
    }

    .badge-shiny {
      background: linear-gradient(90deg, #f0b429, #ffdf7d);
      color: #3a2700
    }

    .badge-dinamax,
    .badge-legendary,
    .badge-mythical,
    .badge-mega {
      display: inline-flex;
      align-items: center;
      gap: .28em;
      color: #fff
    }

    .badge-dinamax {
      background: linear-gradient(90deg, #813459, #dd0b82)
    }

    .badge-legendary {
      background: linear-gradient(90deg, #f0b429, #ffdf7d);
      color: #3a2700
    }

    .badge-mythical {
      background: linear-gradient(90deg, #d9569f, #9d4edd)
    }

    .badge-mega {
      background: linear-gradient(90deg, #7447d8, #e34fa3)
    }

    .badge-icon {
      width: 1em;
      height: 1em;
      flex: 0 0 1em;
      object-fit: contain
    }

    .badge-type {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .25)
    }

    .empty {
      min-height: 250px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted)
    }

    .spinner-border {
      color: #35b9ad
    }

    .toast-container {
      z-index: 1080
    }

    .purified-pokemon img {
      filter: brightness(1.05) drop-shadow(0 0 15px white) drop-shadow(0 0 30px #6feeff)
    }

    .custom-background {
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important
    }

    .background-name {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px 12px 10px;
      text-align: center;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(to bottom, transparent, rgba(10, 18, 35, .75));
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8)
    }

    .vivillon-pattern-badge {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .35))
    }

    /* Nueva información adicional. No altera la tarjeta mientras está cerrada. */
    .pokemon-mobile-details {
      display: none;
      background: #f8faff;
      border-top: 1px solid var(--line);
      padding: 1rem;
      color: var(--ink)
    }

    .pokemon-mobile-details.is-open {
      display: block
    }

    .move-group+.move-group {
      margin-top: 1rem
    }

    .move-title {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #7d8db6;
      margin-bottom: .45rem
    }

    .move-list {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem
    }

    .move-chip {
      padding: .42rem .7rem;
      border-radius: 999px;
      background: #edf1fb;
      border: 1px solid var(--line);
      color: #415078;
      font-size: .82rem;
      font-weight: 700
    }

    .details-empty {
      color: var(--muted);
      font-size: .9rem
    }

    .details-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem
    }

    .details-meta .badge {
      font-size: .78rem
    }

    .modal-content {
      background: rgba(255, 255, 255, .98);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      overflow: hidden
    }

    .pokemon-modal-art {
      min-height: 430px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #dceeff, #f4efff)
    }

    .pokemon-modal-art img {
      position: relative;
      z-index: 2;
      width: 84%;
      height: 84%;
      object-fit: contain;
      filter: drop-shadow(0 20px 18px rgba(0, 0, 0, .28))
    }

    .pokemon-modal-info {
      padding: 2rem
    }

    .modal-close {
      position: absolute;
      z-index: 10;
      top: 1rem;
      right: 1rem
    }

    .modal-backdrop.show {
      opacity: .42
    }

    @media(max-width:575.98px) {
      .pokemon-card:hover {
        transform: none
      }

      .pokemon-modal-art {
        min-height: 300px
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand sticky-top">
    <div class="container py-2"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#"
        style="color:var(--bs-heading-color)"><span class="brand-ball"></span><span id="brandName">PokeTrade</span></a>
    </div>
  </nav>
  <main class="container pb-5">
    <section class="glass rounded-4 p-3 p-lg-4 mb-4" style="margin-top:50px">
      <div class="row g-2">
        <div class="col-lg-10"><input id="search" class="form-control" placeholder="Buscar por nombre o número…"></div>
        <div class="col-12 col-lg-2"><select id="sort" class="form-select">
            <option value="dex">Número de Pokédex</option>
            <option value="cp-desc">PC mayor</option>
            <option value="cp-asc">PC menor</option>
            <option value="name">Nombre</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="rarityFilter" class="form-select">
            <option value="">Todas las rarezas</option>
            <option value="normal">Normal</option>
            <option value="legendary">Legendario</option>
            <option value="mythical">Singular</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="shinyFilter" class="form-select">
            <option value="">Todos los Pokémon</option>
            <option value="true">Solo shiny</option>
            <option value="false">Solo no shiny</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="dinamaxFilter" class="form-select">
            <option value="">Todos los Pokémon</option>
            <option value="true">Solo Dinamax</option>
            <option value="false">Solo no Dinamax</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="megaFilter" class="form-select">
            <option value="">Todos los Pokémon</option>
            <option value="true">Megaevoluciona</option>
            <option value="false">No megaevoluciona</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="statusFilter" class="form-select">
            <option value="">Todos los estados</option>
            <option value="purified">Purificados</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="typeFilter" class="form-select">
            <option value="">Todos los tipos</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="regionFilter" class="form-select">
            <option value="">Todas las regiones</option>
          </select></div>
        <div class="col-6 col-lg-2"><select id="formFilter" class="form-select">
            <option value="">Todas las formas</option>
            <option value="normal">Forma normal</option>
            <option value="variant">Variante</option>
          </select></div>
      </div>
    </section>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 m-0"><span id="count">0</span> <span id="availableLabel">Pokémon disponibles</span></h2><button
        id="clearBtn" class="btn btn-sm btn-outline-secondary">Limpiar filtros</button>
    </div>
    <section id="grid" class="row g-4">
      <div class="col-12">
        <div class="glass rounded-4 empty">
          <div>
            <div class="display-5 mb-2">◓</div><strong id="initialLoading">Cargando Pokémon…</strong>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="modal fade" id="pokemonDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content"><button type="button" class="btn-close modal-close" data-bs-dismiss="modal"
          aria-label="Close"></button>
        <div id="pokemonModalBody" class="row g-0"></div>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast text-bg-dark border">
      <div class="d-flex">
        <div id="toastText" class="toast-body"></div><button class="btn-close btn-close-white m-auto me-2"
          data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = 'https://pokeapi.co/api/v2', COLLECTION_URL = 'https://huliorroche.github.io/collection.xml', LANGUAGE_CONFIG_URL = './languages.json', I18N_BASE_URL = './i18n';
